<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>আজকের শুভেচ্ছা</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Bengali",sans-serif}
body{background:#fff;color:#20242b}
button,input{font:inherit}
#gate,#gift{min-height:100vh}
.hidden{display:none!important}

/* Very clean opening */
#gate{
 display:grid;place-items:center;padding:24px;
 background:#fff;
 text-align:center
}
.open-wrap{width:min(520px,100%)}
.open-wrap .mark{font-size:38px;margin-bottom:18px}
.open-wrap h1{font-size:clamp(30px,7vw,48px);margin:0 0 12px;font-weight:800;color:#222}
.open-wrap p{margin:0 0 25px;color:#707780;line-height:1.8;font-size:14px}
#open{
 border:0;background:#222;color:#fff;border-radius:12px;
 padding:14px 26px;cursor:pointer;font-weight:700;
 box-shadow:0 8px 22px #0002
}
#open:active{transform:scale(.98)}

/* Clean wishing */
#gift{
 display:flex;align-items:center;justify-content:center;
 padding:28px 16px;background:#fff
}
.wish{
 width:min(680px,100%);text-align:center
}
.date{
 display:inline-block;color:#777;font-size:12px;
 margin-bottom:20px
}
.festival{
 margin:0 0 12px;color:#171a1f;
 font-size:clamp(31px,7vw,52px);font-weight:800;line-height:1.2
}
.subtitle{
 margin:0 0 28px;color:#8a8f96;font-size:13px
}
.poem{
 position:relative;padding:10px 10px 18px;
}
.poem:before{
 content:"“";display:block;color:#d4a63a;
 font-family:Georgia,serif;font-size:58px;height:34px;line-height:1
}
.sender{
 display:block;color:#a27413;font-weight:700;
 font-size:14px;margin:0 0 14px
}
.poemtext{
 color:#30343a;font-size:clamp(19px,4vw,27px);
 line-height:1.95;font-weight:600
}
.share-area{
 margin:28px auto 0;width:min(480px,100%);
}
.share-title{font-size:16px;font-weight:700;margin-bottom:9px}
.share-help{font-size:11px;color:#999;margin-bottom:12px}
.input{
 width:100%;height:50px;border:1px solid #ddd;border-radius:10px;
 padding:0 14px;text-align:center;outline:none;color:#222;background:#fff
}
.input:focus{border-color:#999}
.whatsapp{
 width:100%;height:50px;margin-top:9px;border:0;border-radius:10px;
 background:#1fae63;color:#fff;font-weight:700;cursor:pointer
}
.whatsapp:disabled{opacity:.35;cursor:not-allowed}
.footer{margin-top:24px;color:#aaa;font-size:10px}

@media(max-width:500px){
 #gift{padding:22px 13px}
 .poemtext{font-size:18px}
}
</style>
</head>
<body>

<section id="gate">
 <div class="open-wrap">
  <div class="mark">✦</div>
  <h1>আজকের বিশেষ শুভেচ্ছা</h1>
  <p>আজকের দিনের জন্য আপনার জন্য একটি সুন্দর শুভেচ্ছা অপেক্ষা করছে।</p>
  <button id="open" type="button">শুভেচ্ছা দেখুন</button>
 </div>
</section>

<section id="gift" class="hidden">
 <main class="wish">
  <div class="date" id="date"></div>
  <h1 class="festival" id="festival"></h1>
  <p class="subtitle">আপনার প্রিয় মানুষের জন্য একটি আন্তরিক শুভেচ্ছা</p>

  <div class="poem">
   <span class="sender" id="sender"></span>
   <div class="poemtext" id="poem"></div>
  </div>

  <div class="share-area">
   <div class="share-title">আপনার নাম লিখে শুভেচ্ছা পাঠান</div>
   <div class="share-help">নাম লিখলেই WhatsApp পাঠানোর অপশন চালু হবে।</div>
   <input id="name" class="input" maxlength="40" placeholder="আপনার নাম লিখুন">
   <button id="wa" class="whatsapp" type="button" disabled>WhatsApp-এ পাঠান</button>
  </div>

  <div class="footer">ভালো থাকুন • ভালোবাসা ছড়িয়ে দিন</div>
 </main>
</section>

<script>
const festivals={
 "01-01":{n:"নববর্ষ",p:[
 "নতুন বছরের প্রতিটি সকাল তোমার জীবনে নতুন আশার আলো নিয়ে আসুক।<br>পুরনো কষ্টগুলো পেছনে পড়ে থাক, আর সামনে থাকুক শুধু সুন্দর কিছু মুহূর্ত। ❤️",
 "নতুন বছর মানেই নতুন করে স্বপ্ন দেখা।<br>তোমার প্রতিটি ছোট্ট চেষ্টাই একদিন বড় সুখের কারণ হয়ে উঠুক। 🌸"
 ]},
 "08-28":{n:"রাখি বন্ধন",p:[
 "ছোটবেলার সেই ঝগড়া, হাসি আর হাজার স্মৃতি—<br>সময় বদলালেও ভাই-বোনের এই ভালোবাসাটা যেন কোনোদিন বদলে না যায়। ❤️",
 "রাখির এই ছোট্ট বন্ধনটা শুধু হাতে নয়, থাকুক সারাজীবন মনের মধ্যে।<br>দূরে থাকলেও আপন মানুষটা যেন সবসময় ভালো থাকে। 🎀"
 ]},
 "09-04":{n:"জন্মাষ্টমী",p:[
 "কৃষ্ণের বাঁশির সুরের মতো শান্ত হোক মনের সব ক্লান্তি,<br>জীবনের প্রতিটি পথে জেগে থাকুক ভালোবাসা আর শান্তি। 💙",
 "ভক্তির আলোয় মুছে যাক মনের সব অন্ধকার,<br>শ্রীকৃষ্ণের কৃপায় সুন্দর হোক তোমার আগামী প্রতিটি দিন। 🙏"
 ]},
 "09-14":{n:"গণেশ চতুর্থী",p:[
 "যত বাধাই আসুক সামনে, সাহস যেন কখনও কমে না যায়।<br>গণেশের আশীর্বাদে তোমার পরিশ্রম একদিন সাফল্যের হাসি হয়ে ফিরে আসুক। 🐘",
 "নতুন পথের প্রতিটি পদক্ষেপে থাকুক শুভ শক্তি,<br>তোমার জীবন ভরে উঠুক শান্তি, সাফল্য আর আনন্দে। ✨"
 ]},
 "10-10":{n:"মহালয়া",p:[
 "শিউলির গন্ধে ভোর হোক, কাশফুল দুলুক হাওয়ায়,<br>মায়ের আগমনের আনন্দটা ছড়িয়ে পড়ুক তোমার মনখানায়। 🌺",
 "আগমনী সুরে আজ মনটা একটু বেশি ভালো থাকুক,<br>মায়ের কৃপায় তোমার আপন মানুষগুলো সবসময় হাসিমুখে থাকুক। ❤️"
 ]},
 "10-16":{n:"দুর্গাপূজা — ষষ্ঠী",p:[
 "মায়ের আগমনের আনন্দে মনটা আজ নতুন করে হাসুক,<br>আপন মানুষগুলোর ভালোবাসায় প্রতিটি মুহূর্ত সুন্দর হয়ে উঠুক। 🌺"
 ]},
 "10-19":{n:"মহাষ্টমী",p:[
 "মায়ের শক্তি থাকুক মনে, সাহস থাকুক প্রাণে,<br>চুপচাপ দেখা স্বপ্নগুলো একদিন সত্যি হোক তোমারই টানে। ❤️"
 ]},
 "10-20":{n:"মহানবমী",p:[
 "আজকের আলোয় পুরনো কষ্টগুলো একটু দূরে সরিয়ে রাখো,<br>মায়ের আশীর্বাদে নতুন স্বপ্ন নিয়ে আবার সামনে এগিয়ে চলো। 🌸"
 ]},
 "10-21":{n:"বিজয়া দশমী",p:[
 "বিসর্জনের জলে ভেসে যাক সব অভিমান,<br>দূরে থেকেও প্রিয় মানুষগুলোর জীবনে থাকুক ভালোবাসা আর সম্মান। ❤️",
 "বিজয়ার দিনে একটাই চাওয়া—সবাই ভালো থাকুক,<br>যাদের ভালোবাসি, তাদের মুখের হাসিটা যেন কখনও হারিয়ে না যাক। 🌺"
 ]},
 "10-26":{n:"লক্ষ্মী পূজা",p:[
 "ঘর ভরে উঠুক শান্তিতে, মন ভরে উঠুক সুখে,<br>মা লক্ষ্মীর আশীর্বাদ থাকুক তোমার পরিবারের প্রতিটি মুখে। 🪔"
 ]},
 "11-08":{n:"কালী পূজা ও দীপাবলি",p:[
 "একটি প্রদীপ যেমন অন্ধকার সরিয়ে দেয়,<br>তেমনি একটু ভালোবাসাও মানুষের কঠিন দিনটাকে সুন্দর করে দেয়। 🪔❤️",
 "আলো শুধু ঘরে নয়, মানুষের মনেও জ্বালো।<br>দীপাবলির এই দিনে তোমার জীবন ভরে উঠুক শান্তি আর আনন্দে। ✨"
 ]},
 "11-11":{n:"ভাই ফোঁটা",p:[
 "জীবন যত ব্যস্ত হোক, এই সম্পর্কটা যেন একই থাকে—<br>একজনের হাসিতে অন্যজনের মন ভালো হয়ে যাক, এটাই তো ভাই-বোনের ভালোবাসা। ❤️"
 ]},
 "12-25":{n:"বড়দিন",p:[
 "উপহার যতই দামি হোক, প্রিয় মানুষের হাসির মতো সুন্দর নয়।<br>এই বড়দিনে তোমার চারপাশের মানুষগুলো ভালো থাকুক—এটাই সবচেয়ে বড় আনন্দ। 🎄❤️",
 "ক্রিসমাসের আলোয় রাতটা একটু বেশি সুন্দর হোক,<br>আপন মানুষগুলো কাছে থাকুক, আর মনটা ভালোবাসায় ভরে উঠুক। ✨"
 ]}
};
const fallback={n:"আজকের শুভেচ্ছা",p:[
 "সব দিন একরকম যায় না, কিছু দিন শুধু মনে রাখার জন্য আসে।<br>আজকের দিনটা তোমার মুখে হাসি আনুক, আর আগামীকালটা হোক আরও সুন্দর। ❤️",
 "জীবনের ব্যস্ততার মাঝেও কিছু মানুষ মনে শান্তি এনে দেয়।<br>আজ সেই প্রিয় মানুষগুলোর জন্য রইল একটুখানি আন্তরিক শুভেচ্ছা। 🌸",
 "সবকিছু নিখুঁত না হলেও জীবন সুন্দর হতে পারে—<br>যদি পাশে থাকে ভালো মানুষ, আর মনে থাকে একটু আশা। 💛"
]};

const d=new Date();
const key=String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const f=festivals[key]||fallback;
const q=new URLSearchParams(location.search);
const from=(q.get("from")||"").trim();
let index=Number(q.get("s"));
if(!Number.isInteger(index)||index<0||index>=f.p.length)index=Math.floor(Math.random()*f.p.length);

const months=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
document.getElementById("date").textContent=d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear();
document.getElementById("festival").textContent=f.n;
document.getElementById("sender").textContent=from?from+"-এর পক্ষ থেকে ❤️":"আপনার জন্য আন্তরিক শুভেচ্ছা ❤️";
document.getElementById("poem").innerHTML=f.p[index];

const gate=document.getElementById("gate"),gift=document.getElementById("gift");
document.getElementById("open").addEventListener("click",()=>{
 gate.classList.add("hidden");gift.classList.remove("hidden");window.scrollTo(0,0);
});

const name=document.getElementById("name"),wa=document.getElementById("wa");
name.addEventListener("input",()=>wa.disabled=!name.value.trim());
wa.addEventListener("click",()=>{
 const n=name.value.trim();if(!n)return;
 let next=Math.floor(Math.random()*f.p.length);
 if(f.p.length>1&&next===index)next=(next+1)%f.p.length;
 const u=new URL(location.href);u.searchParams.set("from",n);u.searchParams.set("s",next);
 const msg="হ্যালো 👋\n"+n+"-এর পক্ষ থেকে আপনার জন্য "+f.n+"-এর একটি আন্তরিক শুভেচ্ছা এসেছে। ❤️\n\nশুভেচ্ছাটি দেখতে এখানে ক্লিক করুন:\n"+u.href;
 window.location.href="https://wa.me/?text="+encodeURIComponent(msg);
});
</script>
</body>
</html>
